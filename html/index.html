<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Processor (Courtesy of DeepSite)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .slide-transition {
            transition: all 0.5s ease-in-out;
        }
        .caption-highlight {
            background-color: rgba(255, 255, 0, 0.3);
            border-radius: 4px;
            padding: 2px 4px;
        }
        .waveform {
            height: 60px;
            background: linear-gradient(90deg, #4f46e5, #a855f7);
            position: relative;
            border-radius: 8px;
        }
        .waveform-bar {
            position: absolute;
            bottom: 0;
            width: 3px;
            background-color: white;
            border-radius: 2px;
            transition: height 0.1s ease;
        }
        .progress-indicator {
            position: absolute;
            top: -10px;
            width: 2px;
            height: 80px;
            background-color: white;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="gradient-bg text-white py-12 px-4 shadow-lg">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-4xl font-bold mb-2">YouTube Video Processor</h1>
            <p class="text-xl opacity-90 mb-8">Extract captions, generate summaries, and create presentations from any YouTube video</p>
            
            <div class="bg-white bg-opacity-20 rounded-xl p-6 backdrop-blur-sm">
                <div class="flex flex-col md:flex-row gap-4">
                    <input 
                        type="text" 
                        id="youtubeUrl" 
                        placeholder="Paste YouTube URL here..." 
                        class="flex-grow px-4 py-3 rounded-lg bg-white bg-opacity-90 text-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-300"
                    >
                    <button 
                        id="processBtn" 
                        class="px-6 py-3 bg-white text-purple-700 font-semibold rounded-lg hover:bg-opacity-90 transition flex items-center justify-center gap-2"
                    >
                        <i class="fas fa-magic"></i> Process Video
                    </button>
                </div>
                
                <div class="mt-4 flex flex-wrap gap-3">
                    <div class="flex items-center">
                        <input type="checkbox" id="extractCaptions" class="mr-2" checked>
                        <label for="extractCaptions">Extract Captions</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="generateSummary" class="mr-2" checked>
                        <label for="generateSummary">Generate AI Summary</label>
                    </div>
                    <div class="flex items-center">
                        <input type="checkbox" id="createSlides" class="mr-2" checked>
                        <label for="createSlides">Create Slide Presentation</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <!-- Loading State -->
        <div id="loadingState" class="hidden text-center py-12">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-purple-500 mb-4"></div>
            <h3 class="text-xl font-semibold text-gray-700">Processing your video...</h3>
            <p class="text-gray-500 mt-2">This may take a few moments depending on video length</p>
            
            <div class="mt-8 max-w-md mx-auto bg-gray-200 rounded-full h-4">
                <div id="progressBar" class="bg-purple-600 h-4 rounded-full" style="width: 0%"></div>
            </div>
            <div class="mt-2 text-sm text-gray-600">
                <span id="progressText">0%</span> completed
            </div>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="hidden">
            <!-- Video Info -->
            <div class="bg-white rounded-xl shadow-md overflow-hidden mb-8">
                <div class="md:flex">
                    <div class="md:w-1/3">
                        <img id="videoThumbnail" src="" alt="Video thumbnail" class="w-full h-full object-cover">
                    </div>
                    <div class="p-6 md:w-2/3">
                        <h2 id="videoTitle" class="text-2xl font-bold text-gray-800 mb-2"></h2>
                        <p id="videoChannel" class="text-gray-600 mb-4"></p>
                        <div class="flex flex-wrap gap-2 mb-4">
                            <span class="bg-gray-100 px-3 py-1 rounded-full text-sm text-gray-700">
                                <i class="fas fa-clock mr-1"></i> <span id="videoDuration"></span>
                            </span>
                            <span class="bg-gray-100 px-3 py-1 rounded-full text-sm text-gray-700">
                                <i class="fas fa-eye mr-1"></i> <span id="videoViews"></span> views
                            </span>
                            <span class="bg-gray-100 px-3 py-1 rounded-full text-sm text-gray-700">
                                <i class="fas fa-calendar mr-1"></i> <span id="videoDate"></span>
                            </span>
                        </div>
                        <p id="videoDescription" class="text-gray-700"></p>
                    </div>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div class="border-b border-gray-200 mb-8">
                <nav class="flex flex-wrap -mb-px">
                    <button data-tab="captions" class="tab-btn mr-8 py-4 px-1 border-b-2 font-medium text-sm border-purple-500 text-purple-600">
                        <i class="fas fa-closed-captioning mr-2"></i> Captions
                    </button>
                    <button data-tab="summary" class="tab-btn mr-8 py-4 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        <i class="fas fa-robot mr-2"></i> AI Summary
                    </button>
                    <button data-tab="slides" class="tab-btn mr-8 py-4 px-1 border-b-2 font-medium text-sm border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        <i class="fas fa-images mr-2"></i> Slide Presentation
                    </button>
                </nav>
            </div>

            <!-- Tab Contents -->
            <div id="captionsTab" class="tab-content">
                <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 mb-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-semibold text-gray-800">Video Captions</h3>
                        <button id="downloadCaptions" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition flex items-center gap-2">
                            <i class="fas fa-download"></i> Download as TXT
                        </button>
                    </div>
                    
                    <div class="mb-6">
                        <div class="waveform" id="waveform">
                            <div class="progress-indicator" id="progressIndicator"></div>
                        </div>
                    </div>
                    
                    <div id="captionsContent" class="h-96 overflow-y-auto p-4 bg-gray-50 rounded-lg">
                        <!-- Captions will be inserted here -->
                    </div>
                </div>
            </div>

            <div id="summaryTab" class="tab-content hidden">
                <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 mb-8">
                    <h3 class="text-xl font-semibold text-gray-800 mb-6">AI Generated Summary</h3>
                    <div id="summaryContent" class="prose max-w-none">
                        <!-- Summary will be inserted here -->
                    </div>
                </div>
            </div>

            <div id="slidesTab" class="tab-content hidden">
                <div class="bg-white rounded-xl shadow-md overflow-hidden p-6 mb-8">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-xl font-semibold text-gray-800">Slide Presentation</h3>
                        <button id="downloadSlides" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition flex items-center gap-2">
                            <i class="fas fa-file-powerpoint"></i> Export as PDF
                        </button>
                    </div>
                    
                    <div id="slidesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <!-- Slides will be inserted here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden text-center py-12">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 rounded-full mb-4">
                <i class="fas fa-exclamation-triangle text-red-500 text-2xl"></i>
            </div>
            <h3 class="text-xl font-semibold text-gray-700 mb-2">Error Processing Video</h3>
            <p id="errorMessage" class="text-gray-500 max-w-md mx-auto"></p>
            <button id="tryAgainBtn" class="mt-6 px-6 py-3 bg-purple-600 text-white font-semibold rounded-lg hover:bg-purple-700 transition">
                Try Again
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching functionality
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            
            tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove active class from all buttons
                    tabButtons.forEach(btn => {
                        btn.classList.remove('border-purple-500', 'text-purple-600');
                        btn.classList.add('border-transparent', 'text-gray-500');
                    });
                    
                    // Add active class to clicked button
                    button.classList.remove('border-transparent', 'text-gray-500');
                    button.classList.add('border-purple-500', 'text-purple-600');
                    
                    // Hide all tab contents
                    tabContents.forEach(content => {
                        content.classList.add('hidden');
                    });
                    
                    // Show selected tab content
                    const tabId = button.getAttribute('data-tab') + 'Tab';
                    document.getElementById(tabId).classList.remove('hidden');
                });
            });
            
            // Process button functionality
            const processBtn = document.getElementById('processBtn');
            const youtubeUrlInput = document.getElementById('youtubeUrl');
            const loadingState = document.getElementById('loadingState');
            const resultsContainer = document.getElementById('resultsContainer');
            const errorState = document.getElementById('errorState');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            
            processBtn.addEventListener('click', processVideo);
            
            function processVideo() {
                const url = youtubeUrlInput.value.trim();
                
                if (!url) {
                    showError("Please enter a YouTube URL");
                    return;
                }
                
                // Validate YouTube URL
                if (!isValidYouTubeUrl(url)) {
                    showError("Please enter a valid YouTube URL");
                    return;
                }
                
                // Show loading state
                loadingState.classList.remove('hidden');
                resultsContainer.classList.add('hidden');
                errorState.classList.add('hidden');
                
                // Simulate processing (in a real app, this would be an API call)
                simulateProcessing();
            }
            
            function isValidYouTubeUrl(url) {
                const pattern = /^(https?:\/\/)?(www\.)?(youtube\.com|youtu\.?be)\/.+$/;
                return pattern.test(url);
            }
            
            function simulateProcessing() {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.random() * 10;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        
                        // Show results after a short delay
                        setTimeout(showResults, 500);
                    }
                    
                    progressBar.style.width = `${progress}%`;
                    progressText.textContent = `${Math.round(progress)}%`;
                }, 500);
            }
            
            function showResults() {
                loadingState.classList.add('hidden');
                
                // In a real app, you would fetch actual data from an API
                // For this demo, we'll use mock data
                populateVideoInfo();
                populateCaptions();
                populateSummary();
                populateSlides();
                
                resultsContainer.classList.remove('hidden');
                
                // Initialize waveform visualization
                createWaveform();
            }
            
            function showError(message) {
                loadingState.classList.add('hidden');
                resultsContainer.classList.add('hidden');
                errorState.classList.remove('hidden');
                document.getElementById('errorMessage').textContent = message;
            }
            
            function populateVideoInfo() {
                // Mock data - in a real app, you would fetch this from an API
                document.getElementById('videoTitle').textContent = "How to Build a Modern Web Application";
                document.getElementById('videoChannel').textContent = "by Web Dev Simplified";
                document.getElementById('videoDuration').textContent = "12:34";
                document.getElementById('videoViews').textContent = "1,234,567";
                document.getElementById('videoDate').textContent = "May 15, 2023";
                document.getElementById('videoDescription').textContent = "In this tutorial, we'll walk through building a complete modern web application using the latest technologies including React, Tailwind CSS, and Node.js.";
                document.getElementById('videoThumbnail').src = "https://i.ytimg.com/vi/dQw4w9WgXcQ/maxresdefault.jpg";
            }
            
            function populateCaptions() {
                const captionsContent = document.getElementById('captionsContent');
                captionsContent.innerHTML = '';
                
                // Mock captions data
                const mockCaptions = [
                    { time: "00:00:05", text: "Welcome to this tutorial on building modern web applications." },
                    { time: "00:00:12", text: "Today we'll be covering three main topics." },
                    { time: "00:00:18", text: "First, we'll look at the frontend with React." },
                    { time: "00:00:25", text: "Then we'll style our app using Tailwind CSS." },
                    { time: "00:00:32", text: "Finally, we'll build a backend API with Node.js." },
                    { time: "00:01:45", text: "Let's start by creating a new React project." },
                    { time: "00:03:20", text: "Now we'll add some basic components to our app." },
                    { time: "00:05:10", text: "This is how you create reusable components in React." },
                    { time: "00:08:30", text: "Now let's make our UI look great with Tailwind CSS." },
                    { time: "00:10:45", text: "Finally, we'll connect to our Node.js backend API." },
                    { time: "00:12:20", text: "That's it for this tutorial! Thanks for watching." }
                ];
                
                mockCaptions.forEach(caption => {
                    const captionElement = document.createElement('div');
                    captionElement.className = 'mb-4 p-3 hover:bg-gray-100 rounded-lg cursor-pointer slide-transition';
                    captionElement.innerHTML = `
                        <div class="text-sm text-purple-600 font-medium mb-1">${caption.time}</div>
                        <div class="text-gray-800">${caption.text}</div>
                    `;
                    
                    // Add click handler to jump to time in video
                    captionElement.addEventListener('click', function() {
                        highlightCaption(captionElement);
                        // In a real app, this would seek the video to the caption's time
                    });
                    
                    captionsContent.appendChild(captionElement);
                });
                
                // Set up download button
                document.getElementById('downloadCaptions').addEventListener('click', function() {
                    // In a real app, this would generate a downloadable file
                    alert("In a real implementation, this would download the captions as a text file.");
                });
            }
            
            function highlightCaption(element) {
                // Remove highlight from all captions
                document.querySelectorAll('#captionsContent > div').forEach(el => {
                    el.classList.remove('bg-purple-50', 'border-l-4', 'border-purple-500');
                });
                
                // Add highlight to clicked caption
                element.classList.add('bg-purple-50', 'border-l-4', 'border-purple-500');
                
                // Scroll to caption
                element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            
            function populateSummary() {
                const summaryContent = document.getElementById('summaryContent');
                
                // Mock AI summary
                summaryContent.innerHTML = `
                    <h3 class="text-lg font-semibold mb-4">Key Points from the Video</h3>
                    <ul class="list-disc pl-5 space-y-2">
                        <li>The tutorial covers building a full-stack web application using React, Tailwind CSS, and Node.js</li>
                        <li>It begins with setting up a new React project and creating basic components</li>
                        <li>The video demonstrates how to make reusable components in React</li>
                        <li>Tailwind CSS is used for styling the application with utility classes</li>
                        <li>The backend is built with Node.js to create a RESTful API</li>
                        <li>The tutorial shows how to connect the React frontend to the Node.js backend</li>
                    </ul>
                    
                    <h3 class="text-lg font-semibold mt-6 mb-4">Actionable Takeaways</h3>
                    <ol class="list-decimal pl-5 space-y-2">
                        <li>Use <code>create-react-app</code> to quickly bootstrap a new React project</li>
                        <li>Structure your components for reusability and maintainability</li>
                        <li>Leverage Tailwind's utility classes for rapid UI development</li>
                        <li>Implement proper error handling in your API endpoints</li>
                        <li>Use environment variables for configuration between development and production</li>
                    </ol>
                `;
            }
            
            function populateSlides() {
                const slidesContainer = document.getElementById('slidesContainer');
                slidesContainer.innerHTML = '';
                
                // Mock slide data
                const mockSlides = [
                    { 
                        time: "00:00", 
                        title: "Introduction", 
                        image: "https://via.placeholder.com/400x225/4f46e5/ffffff?text=Introduction",
                        content: "Overview of building a modern web application with React, Tailwind, and Node.js"
                    },
                    { 
                        time: "02:15", 
                        title: "React Setup", 
                        image: "https://via.placeholder.com/400x225/7c3aed/ffffff?text=React+Setup",
                        content: "Creating a new React project and initial component structure"
                    },
                    { 
                        time: "04:30", 
                        title: "Component Design", 
                        image: "https://via.placeholder.com/400x225/10b981/ffffff?text=Components",
                        content: "Building reusable components with proper props and state management"
                    },
                    { 
                        time: "06:45", 
                        title: "Tailwind Styling", 
                        image: "https://via.placeholder.com/400x225/f59e0b/ffffff?text=Styling",
                        content: "Using Tailwind CSS utility classes to style the application"
                    },
                    { 
                        time: "09:20", 
                        title: "Node.js Backend", 
                        image: "https://via.placeholder.com/400x225/ef4444/ffffff?text=Backend",
                        content: "Setting up a Node.js server with Express and creating API endpoints"
                    },
                    { 
                        time: "11:50", 
                        title: "Frontend-Backend Connection", 
                        image: "https://via.placeholder.com/400x225/3b82f6/ffffff?text=Integration",
                        content: "Connecting the React frontend to the Node.js backend using fetch API"
                    }
                ];
                
                mockSlides.forEach(slide => {
                    const slideElement = document.createElement('div');
                    slideElement.className = 'bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition';
                    slideElement.innerHTML = `
                        <div class="relative">
                            <img src="${slide.image}" alt="${slide.title}" class="w-full h-48 object-cover">
                            <div class="absolute bottom-2 left-2 bg-black bg-opacity-70 text-white text-xs px-2 py-1 rounded">
                                ${slide.time}
                            </div>
                        </div>
                        <div class="p-4">
                            <h4 class="font-semibold text-lg mb-2">${slide.title}</h4>
                            <p class="text-gray-600 text-sm">${slide.content}</p>
                        </div>
                    `;
                    
                    slidesContainer.appendChild(slideElement);
                });
                
                // Set up download button
                document.getElementById('downloadSlides').addEventListener('click', function() {
                    // In a real app, this would generate a downloadable PDF
                    alert("In a real implementation, this would generate a PDF slide deck.");
                });
            }
            
            function createWaveform() {
                const waveform = document.getElementById('waveform');
                waveform.innerHTML = '';
                
                // Create progress indicator
                const indicator = document.createElement('div');
                indicator.id = 'progressIndicator';
                indicator.style.left = '0%';
                waveform.appendChild(indicator);
                
                // Create random waveform bars (in a real app, this would use actual audio data)
                for (let i = 0; i < 200; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'waveform-bar';
                    bar.style.left = `${i * 0.5}%`;
                    bar.style.height = `${Math.random() * 50 + 10}px`;
                    waveform.appendChild(bar);
                }
                
                // Simulate progress animation
                let position = 0;
                const animateWaveform = () => {
                    position += 0.5;
                    if (position > 100) position = 0;
                    indicator.style.left = `${position}%`;
                    requestAnimationFrame(animateWaveform);
                };
                
                animateWaveform();
            }
            
            // Try again button
            document.getElementById('tryAgainBtn').addEventListener('click', function() {
                errorState.classList.add('hidden');
                youtubeUrlInput.focus();
            });
            
            // Allow pressing Enter to process video
            youtubeUrlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    processVideo();
                }
            });
        });
    </script>
</body>
</html>
