<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#grad)"/>
  <!-- Film strip / video frame -->
  <rect x="80" y="140" width="352" height="232" rx="24" fill="white" opacity="0.95"/>
  <!-- Film perforations left -->
  <rect x="100" y="160" width="24" height="32" rx="4" fill="url(#grad)"/>
  <rect x="100" y="208" width="24" height="32" rx="4" fill="url(#grad)"/>
  <rect x="100" y="256" width="24" height="32" rx="4" fill="url(#grad)"/>
  <rect x="100" y="304" width="24" height="32" rx="4" fill="url(#grad)"/>
  <!-- Film perforations right -->
  <rect x="388" y="160" width="24" height="32" rx="4" fill="url(#grad)"/>
  <rect x="388" y="208" width="24" height="32" rx="4" fill="url(#grad)"/>
  <rect x="388" y="256" width="24" height="32" rx="4" fill="url(#grad)"/>
  <rect x="388" y="304" width="24" height="32" rx="4" fill="url(#grad)"/>
  <!-- Play button -->
  <circle cx="256" cy="256" r="64" fill="url(#grad)" opacity="0.9"/>
  <polygon points="240,224 240,288 288,256" fill="white"/>
  <!-- Conversion arrows -->
  <path d="M180 420 L256 380 L332 420" stroke="white" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M256 380 L256 440" stroke="white" stroke-width="16" stroke-linecap="round"/>
</svg>

